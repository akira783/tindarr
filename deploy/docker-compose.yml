# Example deployment of the Tindarr server. The guide that explains every line is
# ../docs/deployment.md.
#
# No image is published yet (roadmap step 5), so this builds one from the repository
# root — the image contains the web console, so the build needs web/, shared/i18n/ and
# shared/design/ (not api/openapi.yaml: web/src/api/schema.d.ts is committed and
# `npm run build` does not regenerate it, which is why .dockerignore never sends it):
#   docker compose -f deploy/docker-compose.yml up -d --build
# Once images land on GHCR, delete the `build:` block and uncomment the `image:` line
# below: nothing else in this file changes.
#
# The first start generates /data/secret.key (mode 0600). Back up the volume and the key
# separately: a database copy is useless without the key. To manage the key yourself,
# provide it as a Docker secret instead (see the commented lines below).
name: tindarr

services:
  tindarr:
    # The path that works today. Building takes a Node stage and a uv stage; the
    # runtime image has neither.
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: tindarr-server:local
    # After the first GHCR release, this replaces both lines above. Pin a version:
    # `latest` turns every `docker compose pull` into an unreviewed upgrade, and this
    # server holds your media server's admin key.
    # image: ghcr.io/akira783/tindarr:0.1.0
    restart: unless-stopped
    ports:
      # Loopback only: Docker's published ports bypass host firewalls such as ufw.
      # Reach the server through a TLS-terminating reverse proxy on this host. To serve
      # other devices directly, publish on a specific LAN address instead.
      - "127.0.0.1:8787:8787"
    environment:
      TINDARR_LOG_LEVEL: INFO
      # The console is served under / from TINDARR_WEB_DIR (default /app/web).
      # Reach the server by a domain name? Set TINDARR_PUBLIC_URL (or
      # TINDARR_ALLOWED_HOSTS), otherwise the Host header is refused.
      # TINDARR_PUBLIC_URL: https://tindarr.example.com
      # Honour X-Forwarded-For/-Proto only from your reverse proxy. Name its one
      # address, never a range: a trusted hop may claim any client address (including
      # 127.0.0.1, which looks local and private) and any scheme (https), so a range
      # such as 172.16.0.0/12 trusts every container on every Docker bridge network.
      # `docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'
      # <proxy>` prints the address to put here.
      # TINDARR_TRUSTED_PROXIES: 172.18.0.2/32
      # TINDARR_SECRET_KEY_FILE: /run/secrets/tindarr_secret_key
    # secrets:
    #   - tindarr_secret_key
    volumes:
      - tindarr-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    # Bounds a runaway process (fork loop, memory leak) instead of the whole host.
    # Measured idle on a fresh install: 128 MiB and 4 processes.
    pids_limit: 256
    mem_limit: 512m
    # JSON-lines logs on stdout, one line per request. Without a cap, a server that is
    # scanned all night fills the host's disk and takes the media server with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # The image already declares HEALTHCHECK ["tindarr", "healthcheck"], which exits 0
    # when /healthz answers; `docker compose ps` reports healthy about 20 s after
    # start. Override it here only to change the intervals.

volumes:
  tindarr-data:

# secrets:
#   tindarr_secret_key:
#     file: ./secret_key.txt   # at least 32 characters, e.g. `openssl rand -base64 32`
