# Example deployment of the Tindeerr server.
#
# Until images are published (roadmap step 5), this builds the image from the
# repository root (the image contains the web console, so the build needs web/,
# shared/i18n/ and api/openapi.yaml):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The first start generates /data/secret.key (mode 0600). Back up the volume and the key
# separately: a database copy is useless without the key. To manage the key yourself,
# provide it as a Docker secret instead (see the commented lines below).
name: tindeerr

services:
  tindeerr:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: tindeerr-server:local
    restart: unless-stopped
    ports:
      # Loopback only: Docker's published ports bypass host firewalls such as ufw.
      # Reach the server through a TLS-terminating reverse proxy on this host. To serve
      # other devices directly, publish on a specific LAN address instead.
      - "127.0.0.1:8787:8787"
    environment:
      TINDEERR_LOG_LEVEL: INFO
      # The console is served under / from TINDEERR_WEB_DIR (default /app/web).
      # Reach the server by a domain name? Set TINDEERR_PUBLIC_URL (or
      # TINDEERR_ALLOWED_HOSTS), otherwise the Host header is refused.
      # TINDEERR_PUBLIC_URL: https://tindeerr.example.com
      # Honour X-Forwarded-For/-Proto only from your reverse proxy (IPs or CIDRs).
      # TINDEERR_TRUSTED_PROXIES: 172.16.0.0/12
      # TINDEERR_SECRET_KEY_FILE: /run/secrets/tindeerr_secret_key
    # secrets:
    #   - tindeerr_secret_key
    volumes:
      - tindeerr-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    # Bounds a runaway process (fork loop, memory leak) instead of the whole host.
    pids_limit: 256
    mem_limit: 512m

volumes:
  tindeerr-data:

# secrets:
#   tindeerr_secret_key:
#     file: ./secret_key.txt   # at least 32 characters, e.g. `openssl rand -base64 32`
