openapi: 3.1.0
info:
  title: Tindarr API
  version: 1.0.0-draft
  summary: Self-hosted server behind the Tindarr mobile app and web console.
  description: |
    Contract between a Tindarr server and its two clients: the mobile app and the
    web console the server serves under `/`. Written before the implementation; CI
    validates the server's responses against this file and rejects routes it does
    not document.

    Rules (see docs/adr/0006):
    - Additive changes only within v1. Clients ignore unknown fields and treat
      unknown enum values as "other".
    - Errors are `application/problem+json` with a stable `code`.
    - Slow work answers `202` with `retry_after_ms`; the client polls.
    - Every `429` carries `retry_after_ms` and a `Retry-After` header.
    - CORS is disabled: the console is same-origin.

    Every request (docs/auth.md, sections 1 and 2):
    - The `Host` header must be an IP literal, `localhost`, a name in
      `TINDARR_ALLOWED_HOSTS` or the host of `public_url`; anything else gets
      `400` `host_not_allowed` before routing, on every path but `/healthz`.
    - The client IP and scheme come from `X-Forwarded-For` and
      `X-Forwarded-Proto` only when the peer is in `TINDARR_TRUSTED_PROXIES`.
      The server's origin is `<scheme>://<Host>`.
    - Codes, handles and tokens travel in bodies, cookies or headers, never in a
      path or query string.

    Authentication (docs/adr/0009, docs/auth.md section 2), in this order:
    1. The app sends a bearer access token. When an `Authorization` header is
       present it is the only credential considered: every cookie is ignored and
       no CSRF check applies. An operation that does not list `bearer` then
       answers `401` `unauthorized`, as if nothing had been sent.
    2. Otherwise the cookie of the kind the operation accepts is used:
       `__Host-tindarr_session` (`cookieSession`, web session),
       `__Host-tindarr_setup` (`setupSession`, setup session) or
       `__Host-tindarr_preauth` (`preAuth`, binds console sign-in handles). A
       cookie of another kind is never accepted in its place (`401`).
    3. Every authenticated request loads its session and its user: a revoked or
       expired session, or a disabled or unlinked user, gets `401`
       `unauthorized` at once.
    4. CSRF: on `POST`, `PUT`, `PATCH` and `DELETE` authenticated by a cookie,
       `X-CSRF-Token` (the `csrfToken` scheme) must equal the session's CSRF token
       and `Origin` must equal the server's origin; a missing `Origin` is refused.
       Failure: `403` `csrf_failed`. `GET` is never checked and never changes
       state, so `GET` operations list `cookieSession` without `csrfToken`.
    5. Login CSRF: operations that set a cookie without a session (the setup
       claim, the web sign-ins, and Plex PIN and Quick Connect creation by the
       console) check `Origin` the same way. They also answer `403`
       `https_required` over plain HTTP, except from loopback to `localhost` or
       when `TINDARR_ALLOW_HTTP_CONSOLE` applies to a private client IP (the
       cookies are then named without the `__Host-` prefix and `Secure`).
    6. Operations tagged `admin` need the effective role `admin` (`403`
       `admin_required`); some need a media server administrator
       (`media_server_admin_required`) with a re-authentication less than
       5 minutes old (`reauth_required`).
    7. A user whose media server policy forbids remote access gets `403`
       `remote_access_denied` on every request from a non-private client IP.

    Operations without their own `security` accept a bearer token or a web
    session. Operations tagged `console` never accept a bearer token.
    `security: []` marks public operations.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: "{server}"
    variables:
      server:
        default: https://tindarr.example.com

security:
  - bearer: []
  - cookieSession: []
    csrfToken: []

tags:
  - name: server
    description: Health and public server information.
  - name: console
    description: |
      Called by the web console only. A request carrying an `Authorization` header
      gets `401` `unauthorized`. The others take the cookies their `security`
      lists: a web session (plus `X-CSRF-Token` on unsafe methods), the setup
      session for `setup` operations, or none for the sign-ins that set the cookie
      (these check `Origin` instead).
  - name: setup
    description: |
      First-run claim and media server configuration, from the console, with the
      setup session (docs/auth.md, section 3).
  - name: auth
    description: |
      Sign-in through the media server, re-authentication, phone pairing, token
      rotation, sign-out (docs/auth.md, sections 4, 5, 7 and 9).
  - name: me
    description: |
      The signed-in user's account and sessions. Reading is open to both clients;
      deleting the account's data and revoking a session are console only.
  - name: pairing
    description: |
      Connecting a phone by QR code from the console: the app asks with a PKCE
      challenge, the user approves in the console, the app collects its tokens.
  - name: swipe
    description: Deck, votes, requests, likes, taste profile and preferences.
  - name: admin
    description: Connectors, server settings, users and AI usage. Admins only, from the console.

paths:
  /healthz:
    get:
      tags: [server]
      summary: Liveness probe
      operationId: health
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/v1/server/info:
    get:
      tags: [server]
      summary: Server identity, version and capabilities
      description: |
        Public. Returns no user data and no internal URL. `auth_methods` depends on
        the caller's client IP (`password_sign_in = lan_only`), so the response is
        never cached. Never calls the media server.
      operationId: getServerInfo
      security: []
      parameters:
        - name: Tindarr-Verify-Nonce
          in: header
          required: false
          description: |
            Sent only by this server to itself while it verifies a new `public_url`
            (docs/auth.md, section 10). When the nonce is one the server is waiting
            for, the response carries `public_url_proof`; otherwise the header is
            ignored.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- setup
  /api/v1/setup/claim:
    post:
      tags: [setup, console]
      summary: Exchange the one-time setup code for a setup session
      description: |
        Called by the console. Opens a setup session (`kind` = `setup`, 30 minutes,
        no user) in the `__Host-tindarr_setup` cookie and revokes every earlier
        setup session: only the newest claim stays valid. The code stays usable until
        setup completes. `Origin` must be the server's origin, and plain HTTP is
        refused as for the web sign-ins (docs/auth.md, sections 2 and 3).
      operationId: claimServer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_code]
              properties:
                setup_code: { type: string, minLength: 12, maxLength: 64 }
      responses:
        "200":
          description: Setup session opened.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSetupCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_setup_code`, or `unauthorized` when an `Authorization` header is sent."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`csrf_failed` (wrong or missing `Origin`) or `https_required`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Setup already completed (`code` = `setup_completed`).
        # The claim is limited per client IP (5 failures per 15 minutes), with a
        # global slowdown above 20 failures per hour (docs/auth.md, section 8).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/setup/state:
    get:
      tags: [setup, console]
      summary: What the setup wizard still has to do
      description: |
        Whether the media server is configured or locked by environment variables
        (the wizard then skips that step), and which sign-in methods the configured
        server offers for the administrator sign-in that completes setup. After
        completion the setup session no longer exists (`401`).
      operationId: getSetupState
      security:
        - setupSession: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/setup/media-server:
    put:
      tags: [setup, console]
      summary: Configure the media server during setup
      description: |
        The connection is tested before saving, and the server's identity (Jellyfin
        or Emby server id, Plex `machineIdentifier` from the server's own
        `/identity`) is stored (docs/auth.md, section 6). Can be called again while
        setup is pending. For Plex, first obtain the owner token with a Plex PIN of
        purpose `owner_token` (`POST /auth/plex/pins`, then
        `POST /auth/plex/pins/status`); the token must come from the account that
        owns this server. A failed connection test does not consume `plex_pin_id`.
        When `TINDARR_MEDIA_SERVER_KIND`, `_URL` and `_API_KEY` are all set, the
        wizard skips this step (`SetupState.media_server_locked`); a field set by an
        environment variable cannot be given another value (`setting_locked`).
        Connection tests are limited to 10 per minute per session. After this call, a media server administrator signs in on the console, from
        the browser holding the setup session, to complete setup.
      operationId: setupMediaServer
      security:
        - setupSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaServerConfigInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`csrf_failed`, or `plex_owner_required` (the PIN's account does not own that Plex server)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`setting_locked` (a field set by an environment variable), `secret_required` (URL changed and no `api_key` or `plex_pin_id` given) or `plex_pin_pending` (the owner-token PIN is not approved yet)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pin_expired`: `plex_pin_id` is unknown, expired, used, or not an `owner_token` PIN of this setup session."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "Connection test failed: `connector_unreachable`, `connector_unauthorized`, `connector_unexpected_response` or `media_server_unsupported` (another product than `server_type`, or Jellyfin older than 10.10). Nothing is saved."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------- auth (app)
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign the app in with Jellyfin or Emby credentials
      description: |
        The password is checked with the media server and never stored. The
        administrator and remote-access flags are re-read from the media server
        (docs/adr/0010, docs/auth.md section 4). At most 2 failures per case-folded
        username per 15 minutes are forwarded to the media server; beyond that the
        answer is `429` without contacting it.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device]
              properties:
                username: { type: string, minLength: 1, maxLength: 128 }
                password: { type: string, maxLength: 512 }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials` (same answer for unknown user and wrong password)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`account_disabled`, `remote_access_denied` or `password_sign_in_disabled`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`sign_in_method_unavailable` (the media server is Plex)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required` (setup is done in the console), `media_server_unreachable` or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/plex/pins:
    post:
      tags: [auth]
      summary: Start a Plex PIN (sign-in, re-authentication or owner token)
      description: |
        The server creates a strong plex.tv PIN and returns a random handle bound to
        its purpose and to the caller (docs/auth.md, section 5). The client opens
        `auth_url` in a browser, then:
        - `sign_in` from the app: send `code_challenge` (PKCE S256), then poll
          `POST /auth/plex/login` with the `code_verifier`;
        - `sign_in` from the console: no `code_challenge`; the response sets the
          pre-auth cookie and `Origin` is checked; poll `POST /auth/web/plex/login`.
          While setup is pending, only the console can start one (the app gets
          `503 setup_required`);
        - `reauth`: web session and CSRF token; poll `POST /auth/web/reauth`;
        - `owner_token`: setup session, or web session of a media server
          administrator, and CSRF token. Works before any media server is
          configured. Poll `POST /auth/plex/pins/status`, then pass the handle as
          `plex_pin_id` to `PUT /setup/media-server` or
          `PUT /admin/connectors/media_server` (or its `test`).
        `code_challenge` is only accepted with `sign_in`. A bearer token is never
        enough for `reauth` or `owner_token`. At most 5 outstanding handles per
        client IP and 200 in total, and 10 creations per 15 minutes per client IP.
      operationId: createPlexPin
      security:
        - {}
        - cookieSession: []
          csrfToken: []
        - setupSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlexPinRequest" }
      responses:
        "201":
          description: PIN created.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetPreAuthCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [pin_id, auth_url, expires_at]
                properties:
                  pin_id:
                    type: string
                    description: Random handle (at least 128 bits), not the plex.tv PIN id.
                  auth_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`unauthorized`: `reauth` or `owner_token` without the session it needs, or an `Authorization` header with those purposes."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`csrf_failed` (console: wrong or missing `Origin` or CSRF token), `https_required` (console over plain HTTP), `remote_access_denied`, or `media_server_admin_required` (`owner_token` after setup)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`sign_in_method_unavailable` (`sign_in` or `reauth` while no Plex media server is configured)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required` (app `sign_in` during setup) or `plex_tv_unreachable`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/plex/pins/status:
    post:
      tags: [auth, console]
      summary: Status of an owner-token Plex PIN, without using it
      description: |
        For PINs of purpose `owner_token` only, by the session that created them.
        Read-only: the handle stays usable for `PUT /setup/media-server`,
        `PUT /admin/connectors/media_server` and its `test`. A `POST` so that the
        handle never appears in a URL. Checks plex.tv at most once per second per
        handle.
      operationId: getPlexPinStatus
      security:
        - setupSession: []
          csrfToken: []
        - cookieSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin_id]
              properties:
                pin_id: { $ref: "#/components/schemas/Handle" }
      responses:
        "200":
          description: PIN status.
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_at]
                properties:
                  status: { type: string, enum: [pending, authorized] }
                  expires_at: { type: string, format: date-time }
                  account_name:
                    type: [string, "null"]
                    description: The plex.tv account that approved the PIN, once `authorized`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: "`pin_expired` (also for an unknown handle, another purpose or another session)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`plex_tv_unreachable`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/plex/login:
    post:
      tags: [auth]
      summary: Complete a Plex PIN sign-in (app)
      description: |
        Each call polls plex.tv at most once per second. Once approved, the server
        checks that the account can access the configured server (matched by
        `machineIdentifier` only; administrator when `owned` there), then deletes the
        plex.tv device the PIN created and keeps no Plex token (docs/auth.md,
        section 4).
      operationId: loginWithPlex
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin_id, code_verifier, device]
              properties:
                pin_id: { $ref: "#/components/schemas/Handle" }
                code_verifier: { $ref: "#/components/schemas/CodeVerifier" }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: "`account_disabled`, `not_a_server_user` (no plex.tv resource with the configured `machineIdentifier`) or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pin_expired` (also for an unknown or used `pin_id`, another purpose or a wrong `code_verifier`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required`, `plex_tv_unreachable`, `media_server_unreachable` (the Plex server's own identity is re-read before the sign-in uses it, docs/auth.md section 6) or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/quick-connect:
    post:
      tags: [auth]
      summary: Start a Jellyfin Quick Connect sign-in or re-authentication
      description: |
        Jellyfin only (Emby has no Quick Connect). The server calls Jellyfin's
        `POST /QuickConnect/Initiate` and keeps the returned secret. The client
        shows `code`; the user approves it in any Jellyfin client where they are
        signed in. The handle is bound as for Plex PINs (docs/auth.md, section 5):
        the app sends `code_challenge` and polls `POST /auth/quick-connect/login`;
        the console gets the pre-auth cookie and polls
        `POST /auth/web/quick-connect/login`; purpose `reauth` needs a web session
        and is completed by `POST /auth/web/reauth`. `code_challenge` is only
        accepted with `sign_in`. Same caps as Plex PINs. The handle expires after at
        most 5 minutes; approvals nobody collects are cleaned up (docs/auth.md,
        section 4).
      operationId: createQuickConnect
      security:
        - {}
        - cookieSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuickConnectRequest" }
      responses:
        "201":
          description: Quick Connect started.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetPreAuthCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [handle, code, expires_at]
                properties:
                  handle:
                    type: string
                    description: Random handle (at least 128 bits), not the Jellyfin secret.
                  code:
                    type: string
                    description: Code to enter in a signed-in Jellyfin client.
                    examples: ["123456"]
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`unauthorized`: `reauth` without a web session, or with an `Authorization` header."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`csrf_failed` (console: wrong or missing `Origin` or CSRF token), `https_required` (console over plain HTTP) or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`quick_connect_unavailable` (not a Jellyfin server, or Quick Connect disabled there)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required`, `media_server_unreachable` or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/quick-connect/login:
    post:
      tags: [auth]
      summary: Complete a Quick Connect sign-in (app)
      description: |
        Each call checks `GET /QuickConnect/Connect` at most once per second. When
        the code was approved, the server calls
        `POST /Users/AuthenticateWithQuickConnect`, reads the administrator and
        remote-access flags and ends that Jellyfin session.
      operationId: loginWithQuickConnect
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, code_verifier, device]
              properties:
                handle: { $ref: "#/components/schemas/Handle" }
                code_verifier: { $ref: "#/components/schemas/CodeVerifier" }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: "`account_disabled` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`quick_connect_expired` (also for an unknown or used `handle`, another purpose or a wrong `code_verifier`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required`, `media_server_unreachable` or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/pair/preview:
    post:
      tags: [auth, pairing]
      summary: Show who a pairing code signs in, without using it
      description: |
        The app calls this after scanning a QR code, shows the host of the QR
        link prominently (punycode for internationalised names) with the names
        returned here, and asks the user to confirm before calling
        `POST /auth/pair`. Returns only what the app must display, and only for a
        `pending`, unexpired code.
      operationId: previewPairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { $ref: "#/components/schemas/PairingCode" }
      responses:
        "200":
          description: The pairing is valid.
          content:
            application/json:
              schema:
                type: object
                required: [server_name, user_name, expires_at]
                properties:
                  server_name: { type: string }
                  user_name: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410":
          description: "`pairing_expired` (also for an unknown, used, requested or revoked code)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/pair:
    post:
      tags: [auth, pairing]
      summary: Ask to pair the app with a code from the console
      description: |
        Records the device and the PKCE `code_challenge`, and moves the pairing to
        `awaiting_approval`; the code then stops working for preview and pair. The
        app shows `confirmation_code`, which the console shows too, and polls
        `POST /auth/pair/complete` until the user approves or rejects the request in
        the console (docs/auth.md, section 9). Preview and pair share a limit of 10
        calls per minute per client IP; completion has its own, sized for the polling
        the server asks for. A global threshold only slows every pairing call down.
      operationId: pairDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, device, code_challenge]
              properties:
                code: { $ref: "#/components/schemas/PairingCode" }
                device: { $ref: "#/components/schemas/DeviceInput" }
                code_challenge: { $ref: "#/components/schemas/CodeChallenge" }
      responses:
        "202":
          description: Waiting for approval in the console.
          headers:
            Retry-After:
              description: Seconds, rounded up.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingRequested" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410":
          description: "`pairing_expired` (also for an unknown, used, requested or revoked code)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/pair/complete:
    post:
      tags: [auth, pairing]
      summary: Get the tokens once the console approved the pairing
      description: |
        Polled by the app every 2 seconds after `POST /auth/pair`, within its own
        limit of 90 calls per minute per client IP. Once the pairing is approved,
        opens a `mobile` session for the user who created it and marks
        the pairing `completed`. Applies the checks of any authenticated request
        (user enabled, remote-access rule). Does not contact the media server, so
        the administrator flag is not re-synced (docs/adr/0010).
      operationId: completePairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { $ref: "#/components/schemas/PairingCode" }
                code_verifier: { $ref: "#/components/schemas/CodeVerifier" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: "`pairing_rejected` (rejected in the console), `account_disabled` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pairing_expired` (also for an unknown, completed or revoked code, a code never requested, or a wrong `code_verifier`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and get a new access token
      description: |
        Each refresh token works once, with no grace period: presenting a used one,
        even right after its rotation, revokes the whole session (`code` =
        `refresh_token_reused`). Clients must refresh single-flight: one refresh in
        flight at a time, other requests wait for its result (docs/adr/0010). If the
        response is lost, retrying with the old token is a reuse and signs the user
        out; clients do not retry a refresh blindly.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, maxLength: 128 }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`unauthorized` (unknown or expired refresh token, session revoked or past its absolute lifetime, user disabled) or `refresh_token_reused`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      description: For a web session, the response also clears the cookie.
      operationId: logout
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- auth (console)
  /api/v1/auth/web/login:
    post:
      tags: [auth, console]
      summary: Sign the console in with Jellyfin or Emby credentials
      description: |
        Same checks and limits as `POST /auth/login`, but opens a `web` session and
        sets the session cookie. `Origin` must be the server's origin; plain HTTP is
        refused (`https_required`) except as described in docs/auth.md, section 2.
        While setup is pending, the request must carry the setup session cookie
        (`setup_session_required`) and the user must be a media server administrator
        (`admin_required`); that sign-in completes setup, revokes the setup session,
        clears its cookie and opens a new web session with a new CSRF token. A web
        sign-in also counts as a fresh re-authentication (`reauth_expires_at`).
      operationId: webLogin
      security:
        - {}
        - setupSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 128 }
                password: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials` (same answer for unknown user and wrong password), or `unauthorized` when an `Authorization` header is sent."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`account_disabled`, `remote_access_denied`, `password_sign_in_disabled`, `admin_required` or `setup_session_required` while setup is pending, `csrf_failed` (wrong or missing `Origin`), `https_required`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`sign_in_method_unavailable` (the media server is Plex)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required` (no media server configured yet), `media_server_unreachable` or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/web/plex/login:
    post:
      tags: [auth, console]
      summary: Complete a Plex PIN sign-in (console)
      description: |
        Same as `POST /auth/plex/login`, ending in a web session. The handle must
        have been created by this browser: without the matching pre-auth cookie it
        is treated as unknown (`410`). Same `Origin`, HTTPS and setup rules as
        `POST /auth/web/login`.
      operationId: webLoginWithPlex
      security:
        - preAuth: []
        - preAuth: []
          setupSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin_id]
              properties:
                pin_id: { $ref: "#/components/schemas/Handle" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSession" }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`unauthorized`: an `Authorization` header was sent."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`account_disabled`, `not_a_server_user`, `remote_access_denied`, `admin_required` or `setup_session_required` while setup is pending, `csrf_failed`, `https_required`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pin_expired` (also for an unknown or used `pin_id`, another purpose or another browser)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required`, `plex_tv_unreachable`, `media_server_unreachable` (the Plex server's own identity is re-read before the sign-in uses it, docs/auth.md section 6) or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/web/quick-connect/login:
    post:
      tags: [auth, console]
      summary: Complete a Quick Connect sign-in (console)
      description: |
        Same as `POST /auth/quick-connect/login`, ending in a web session. The handle
        must have been created by this browser: without the matching pre-auth
        cookie it is treated as unknown (`410`). Same `Origin`, HTTPS and setup
        rules as `POST /auth/web/login`.
      operationId: webLoginWithQuickConnect
      security:
        - preAuth: []
        - preAuth: []
          setupSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { $ref: "#/components/schemas/Handle" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSession" }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`unauthorized`: an `Authorization` header was sent."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`account_disabled`, `remote_access_denied`, `admin_required` or `setup_session_required` while setup is pending, `csrf_failed`, `https_required`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`quick_connect_expired` (also for an unknown or used `handle`, another purpose or another browser)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`setup_required`, `media_server_unreachable` or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/web/reauth:
    post:
      tags: [auth, console]
      summary: Re-authenticate on the current media server (step-up)
      description: |
        Proves again, on the currently configured media server, that the caller is
        the session's user: a password, or a completed Plex PIN or Quick Connect
        handle of purpose `reauth`. Refreshes the administrator and remote-access
        flags and marks the session re-authenticated for 5 minutes, which changing
        the media server connector and `public_url` require (docs/auth.md,
        section 7). The account must be the session's user (same media server user
        id). With a password, the session user's name is sent to the media server,
        and the attempt counts toward the password limits and follows
        `password_sign_in`. With a handle, the call answers `202` until the user
        approves it, like the sign-in endpoints.
      operationId: webReauth
      security:
        - cookieSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthInput" }
      responses:
        "200":
          description: Re-authenticated.
          content:
            application/json:
              schema:
                type: object
                required: [reauth_expires_at]
                properties:
                  reauth_expires_at: { type: string, format: date-time }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`unauthorized` (no valid web session, or an `Authorization` header) or `invalid_credentials` (wrong password, or another account than the session's user)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: "`csrf_failed`, `remote_access_denied` or `password_sign_in_disabled`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`sign_in_method_unavailable` (a password while the media server is Plex)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pin_expired` or `quick_connect_expired` (also for an unknown or used handle, another purpose or another session)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`media_server_unreachable`, `plex_tv_unreachable` or `media_server_changed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/auth/web/session:
    get:
      tags: [auth, console]
      summary: The current web or setup session, with its CSRF token
      description: |
        The console calls this on load: the CSRF token lives only in memory, so a
        reload gets it back here. Never cached.
      operationId: getWebSession
      security:
        - cookieSession: []
        - setupSession: []
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      tags: [me]
      summary: The signed-in user
      operationId: getMe
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [me, console]
      summary: Delete all of the caller's Tindarr data and sign out everywhere
      description: |
        Votes, profile, preferences and sessions. Nothing is deleted on the media
        server or the request backend. Console only: a phone's token cannot delete
        the account.
      operationId: deleteMyData
      security:
        - cookieSession: []
          csrfToken: []
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string, const: delete-my-data }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`last_admin`: promote another admin first."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/me/sessions:
    get:
      tags: [me]
      summary: The caller's sessions (one per device)
      operationId: listMySessions
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Sessions, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/me/sessions/{session_id}:
    delete:
      tags: [me, console]
      summary: Revoke one of the caller's sessions
      description: Console only. The app signs itself out with `POST /auth/logout`.
      operationId: revokeMySession
      security:
        - cookieSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- pairing
  /api/v1/pairings:
    post:
      tags: [pairing, console]
      summary: Create a code to connect a phone (any signed-in user)
      description: |
        The code is bound to the caller, single-use, valid 5 minutes and stored
        hashed; it is only returned here. The console renders `link` as a QR code
        (SVG or canvas) with the host of `public_url` written next to it. At most 3
        pending pairings per user (`rate_limited` beyond).
      operationId: createPairing
      security:
        - cookieSession: []
          csrfToken: []
      responses:
        "201":
          description: Pairing created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewPairing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`public_url_not_set`: a media server administrator must set `public_url` first."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/pairings/{pairing_id}:
    get:
      tags: [pairing, console]
      summary: Status of one of the caller's pairings
      description: |
        Polled by the console. When `awaiting_approval`, shows the requesting
        device, its IP and the confirmation code the phone displays, so the user
        can approve or reject it; once `completed`, "Pixel 9 connected".
      operationId: getPairing
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/PairingId"
      responses:
        "200":
          description: Pairing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [pairing, console]
      summary: Cancel or reject a pairing, or revoke the session it opened
      description: |
        `pending` or `approved`: cancelled. `awaiting_approval`: rejected, and the
        app's next `POST /auth/pair/complete` gets `403` `pairing_rejected`.
        `completed`: the `mobile` session it opened is revoked.
      operationId: revokePairing
      security:
        - cookieSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/PairingId"
      responses:
        "204": { description: "Cancelled, rejected or revoked." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pairings/{pairing_id}/approve:
    post:
      tags: [pairing, console]
      summary: Approve the phone waiting on this pairing
      description: |
        Only for a pairing in `awaiting_approval`. The console asks the user to
        check that the phone shows the same `confirmation_code` first. The app's
        next `POST /auth/pair/complete` then gets the tokens.
      operationId: approvePairing
      security:
        - cookieSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/PairingId"
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`pairing_not_awaiting_approval` (no phone has asked yet, or already approved, completed or revoked)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pairing_expired`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------- swipe
  /api/v1/swipe/status:
    get:
      tags: [swipe]
      summary: What the deck needs to know before showing cards
      operationId: getSwipeStatus
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwipeStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/swipe/deck:
    get:
      tags: [swipe]
      summary: Next cards, or pending while a batch is generated
      description: |
        Returns the served cards not yet voted on and still in the deck, then
        fresh ones. Calling it again returns the same unvoted cards, so a client
        that lost its state loses nothing. When no card is ready, starts a batch in
        the background and answers `202`; poll after `retry_after_ms`. A finished
        but empty batch answers `200` with no cards and does not start another one.
        The next batch is prepared in the background as the deck runs low.
      operationId: getDeck
      security:
        - bearer: []
        - cookieSession: []
      parameters:
        - name: media_type
          in: query
          schema: { $ref: "#/components/schemas/MediaFilter" }
        - name: novelty
          in: query
          schema: { $ref: "#/components/schemas/Novelty" }
        - name: mode
          in: query
          schema:
            type: string
            enum: [auto, normal, calibration]
            default: auto
        - name: mood
          in: query
          description: Optional free-text wish for this session.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Cards ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }
        "202": { $ref: "#/components/responses/Pending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`llm_not_configured` or `tmdb_not_configured`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: "`rate_limited` or `daily_limit_reached`."
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502":
          description: "The last generation failed: `llm_auth_failed`, `llm_quota`, `llm_model_not_found`, `llm_unreachable`, `llm_invalid_output`. Reported once."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/swipe/votes:
    post:
      tags: [swipe]
      summary: Record votes (one or a queued batch)
      description: |
        Idempotent per `client_vote_id`: resending a vote already stored returns
        `duplicate`. Voting again on the same title replaces the previous vote.
        Items are processed independently. A `skip` ("not now") takes the card out
        of the deck and teaches nothing: see `VoteValue`.
      operationId: submitVotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [votes]
              properties:
                votes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/VoteInput" }
      responses:
        "200":
          description: Per-item results, in input order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/VoteResult" }
                  profile_refresh_started: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [swipe]
      summary: Delete all of the caller's votes (the profile text is kept)
      operationId: resetVotes
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string, const: reset-votes }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/swipe/votes/{media_type}/{tmdb_id}:
    delete:
      tags: [swipe]
      summary: Undo the vote on one title
      description: |
        Works the same for every vote value, `skip` included. The card goes back
        to the top of the deck if it is less than 24 h old. A request already filed
        for the title (auto-request) is not cancelled.
      operationId: undoVote
      parameters:
        - $ref: "#/components/parameters/MediaTypePath"
        - $ref: "#/components/parameters/TmdbIdPath"
      responses:
        "204": { description: Vote removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/swipe/requests:
    post:
      tags: [swipe]
      summary: Request a title through the request backend
      description: |
        Filed as the caller's request-backend user (`X-API-User`), so their
        permissions, quotas, auto-approval and override rules apply. Only titles
        served to or voted on by the caller can be requested (`code` =
        `title_not_offered` otherwise). A title not voted on yet, or skipped, is
        recorded as a `like`; other votes are kept as they are. Requesting a title
        twice answers `already_requested`.
      operationId: requestTitle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TitleRef" }
      responses:
        "200":
          description: Request result.
          content:
            application/json:
              schema:
                type: object
                required: [request_status]
                properties:
                  request_status: { $ref: "#/components/schemas/RequestStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`title_not_offered`, `no_backend_user`, `request_not_allowed` (the backend user may not request this media type), `quota_exceeded`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`requests_not_configured`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`request_backend_error`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/swipe/likes:
    get:
      tags: [swipe]
      summary: The caller's liked titles
      description: |
        Titles whose current vote is `like`: the "to request" list. `seen_liked`
        titles are not listed: they are already seen, so there is nothing to
        request; they only feed the taste profile.
      operationId: listLikes
      security:
        - bearer: []
        - cookieSession: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, to_request, requested]
            default: all
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Likes, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [likes]
                properties:
                  likes:
                    type: array
                    items: { $ref: "#/components/schemas/Like" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/swipe/profile:
    get:
      tags: [swipe]
      summary: The caller's taste profile
      operationId: getProfile
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Profile state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [swipe]
      summary: Replace the profile with text written by the user
      description: Later AI rewrites keep this text and never contradict it.
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/swipe/profile/refresh:
    post:
      tags: [swipe]
      summary: Rewrite the profile in the background
      description: Poll `GET /swipe/profile` until `refreshing` is false.
      operationId: refreshProfile
      responses:
        "202":
          description: Started, or already running.
          content:
            application/json:
              schema:
                type: object
                required: [started]
                properties:
                  started: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/swipe/preferences:
    get:
      tags: [swipe]
      summary: The caller's deck preferences
      operationId: getPreferences
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [swipe]
      summary: Change some preferences
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesPatch" }
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/swipe/providers:
    get:
      tags: [swipe]
      summary: Streaming services available in the server's region
      description: |
        From TMDb (movie and TV watch providers, merged), for the server's
        `streaming_region`, cached by the server for 7 days. The user ticks the
        ones they subscribe to in `Preferences.streaming_services`.
      operationId: listStreamingProviders
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Providers, in TMDb's display order.
          content:
            application/json:
              schema:
                type: object
                required: [region, providers]
                properties:
                  region: { type: string, pattern: "^[A-Z]{2}$" }
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`streaming_region_not_set` or `tmdb_not_configured`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502":
          description: "`metadata_unreachable` and nothing cached."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/swipe/stats:
    get:
      tags: [swipe]
      summary: Like and request rates, overall and per pick type
      description: Skipped titles are counted apart (`skips`) and left out of every rate.
      operationId: getStats
      security:
        - bearer: []
        - cookieSession: []
      responses:
        "200":
          description: Statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- admin
  /api/v1/admin/connectors:
    get:
      tags: [admin, console]
      security:
        - cookieSession: []
      summary: All connectors, secrets masked
      operationId: listConnectors
      responses:
        "200":
          description: Connectors.
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/connectors/{kind}:
    put:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: Configure a connector
      description: |
        Tested before saving. Omitted secret fields keep their stored value, unless
        the address changes (`code` = `secret_required`); for `llm` the provider
        counts as part of the address, and for `requests` so does `verify_tls`,
        since turning it off would otherwise replay the stored key over a
        connection nobody checks. TMDb and OMDb have one host each, written into
        Tindarr, so their key has no address to be moved to and is always reused. Fields locked by an
        environment variable cannot be given another value (`code` =
        `setting_locked`).

        `media_server` (docs/auth.md, section 6) needs more than the admin role:
        the caller must be a media server administrator
        (`media_server_admin_required`: a promoted admin cannot repoint the media
        server) with a re-authentication on the **currently configured** media
        server less than 5 minutes old (`reauth_required`, see
        `POST /auth/web/reauth`). No credential is sent to a new URL before it is
        saved. For Plex, `plex_pin_id` is a completed `owner_token` PIN of this
        session, from the account that owns the server; it is consumed only when
        the connector is saved. When the saved server's identity or kind differs
        from the stored one, the same transaction revokes every session, the
        caller's included (the response clears the session cookie), and unlinks
        every user.
      operationId: saveConnector
      parameters:
        - $ref: "#/components/parameters/ConnectorKind"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorInput" }
      responses:
        "200":
          description: Saved and tested.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connector" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`admin_required`, `media_server_admin_required`, `reauth_required`, `plex_owner_required` (the PIN's account does not own that Plex server), `csrf_failed` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: "`not_found`: no such connector kind."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`setting_locked`, `secret_required` or `plex_pin_pending`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pin_expired`: `plex_pin_id` is unknown, expired, used, or not an `owner_token` PIN of this session."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "Connection test failed: `connector_unreachable`, `connector_unauthorized`, `connector_unexpected_response` or `media_server_unsupported`. Nothing is saved."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: Remove an optional connector (tmdb, omdb, requests, llm)
      description: |
        Only the optional connectors can be removed. `media_server` is not one of
        them: a Tindarr without a media server signs nobody in, so it is repointed
        with `PUT` instead (`409` `media_server_required`). Removing a connector
        that was never configured succeeds and changes nothing.
      operationId: deleteConnector
      parameters:
        - $ref: "#/components/parameters/ConnectorKind"
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404":
          description: "`not_found`: no such connector kind."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`setting_locked` (the connector is set by environment variables) or `media_server_required` (the media server connector cannot be removed)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/admin/connectors/{kind}/test:
    post:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: Test a connector without saving
      description: |
        Returns a coarse result only, never the remote response body. Omitted
        secrets fall back to the stored ones only when the URL is unchanged
        (`code` = `secret_required` otherwise). For a Plex media server,
        `plex_pin_id` is an `owner_token` PIN of this session, which the test does
        not consume. Limited to 10 tests per minute per session.
      operationId: testConnector
      parameters:
        - $ref: "#/components/parameters/ConnectorKind"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorInput" }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`admin_required`, `plex_owner_required` (the PIN's account does not own that Plex server), `csrf_failed` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: "`not_found`: no such connector kind."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`secret_required` or `plex_pin_pending`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "410":
          description: "`pin_expired`: `plex_pin_id` is unknown, expired, used, or not an `owner_token` PIN of this session."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/admin/llm/models:
    post:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: List the models a provider offers
      description: |
        Uses the given settings, or the stored ones for omitted fields. The stored
        API key is only reused when `base_url` is unchanged (`code` =
        `secret_required` otherwise). Returns model ids only.
      operationId: listLlmModels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LlmSettingsInput" }
      responses:
        "200":
          description: Models.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409":
          description: "`secret_required`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/Problem" }

  /api/v1/admin/settings:
    get:
      tags: [admin, console]
      security:
        - cookieSession: []
      summary: General server settings
      operationId: getSettings
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
    patch:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: Change general server settings
      description: |
        Fields locked by an environment variable cannot be given another value
        (`setting_locked`). Some fields need more than the admin role
        (docs/auth.md, section 7):
        - `public_url` (set, changed or cleared): a media server administrator
          (`media_server_admin_required`) with a re-authentication less than
          5 minutes old (`reauth_required`). A new value is verified before it is
          saved (docs/auth.md, section 10): the server requests
          `GET <public_url>/api/v1/server/info` with a fresh nonce, without
          following redirects, with TLS verification and a 5 s deadline, and expects
          the `public_url_proof` **for that host**. Its host must therefore already
          be one this server answers to (`TINDARR_ALLOWED_HOSTS`, or the host the
          console is open at), which is checked before anything is called. Failure:
          `409` `public_url_unverified` with a coarse `reason`. Limited to 10 checks
          per minute per session.
        - `password_sign_in`: a media server administrator
          (`media_server_admin_required`).
        The patch is applied as a whole: when one field is refused, nothing is
        saved.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSettingsPatch" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`admin_required`, `media_server_admin_required`, `reauth_required`, `csrf_failed` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "`setting_locked` or `public_url_unverified` (with `reason`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/admin/users:
    get:
      tags: [admin, console]
      security:
        - cookieSession: []
      summary: Users who signed in at least once
      operationId: listUsers
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/users/{user_id}:
    patch:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: Enable, disable, promote or set limits for a user
      description: |
        Disabling a user revokes their sessions. `role` edits the Tindarr side
        only (docs/adr/0010): `admin` sets `promoted`; `user` clears `promoted` and
        clears `media_server_admin` until the user's next sign-in, where the media
        server's flag is read again (a media server administrator is then admin
        again). Only a media server administrator can demote or disable another
        one (`forbidden`; the same rule guards
        `DELETE /admin/users/{user_id}/sessions`). The last enabled admin cannot be
        demoted or disabled (`last_admin`). Disabling sets `disabled_reason` =
        `admin`.
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                enabled: { type: boolean }
                role: { $ref: "#/components/schemas/Role" }
                daily_generation_limit:
                  type: [integer, "null"]
                  minimum: 0
                  description: Null uses the server default.
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (only a media server administrator can demote or disable another one), `admin_required`, `csrf_failed` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`last_admin`: the last enabled admin cannot be demoted or disabled."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/admin/users/{user_id}/sessions:
    delete:
      tags: [admin, console]
      security:
        - cookieSession: []
          csrfToken: []
      summary: Sign a user out of every device
      description: |
        Only a media server administrator may sign another one out (`forbidden`):
        doing it repeatedly would achieve what demoting them would, which
        `PATCH /admin/users/{user_id}` already refuses (docs/adr/0010).
      operationId: revokeUserSessions
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (only a media server administrator can sign another one out), `admin_required`, `csrf_failed` or `remote_access_denied`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/usage:
    get:
      tags: [admin, console]
      security:
        - cookieSession: []
      summary: AI usage per user and per day
      operationId: getUsage
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/UsageDay" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from an app sign-in, pairing or refresh, valid 15 minutes. Mobile app only.
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-tindarr_session
      description: |
        Web console session (`kind` = `web`): opaque 256-bit token, stored hashed,
        `HttpOnly`, `Secure`, `SameSite=Strict`, `Path=/`, no `Domain`. Expires
        after 24 h idle or 7 days after sign-in. Named `tindarr_session`, without
        `Secure`, only on requests from a private client IP when
        `TINDARR_ALLOW_HTTP_CONSOLE=true` (docs/auth.md, section 2).
    setupSession:
      type: apiKey
      in: cookie
      name: __Host-tindarr_setup
      description: |
        Setup session from `POST /setup/claim` (`kind` = `setup`, no user,
        30 minutes absolute, same attributes as the web session cookie; named
        `tindarr_setup` under the plain-HTTP opt-in). Only one is valid at a time.
        Accepted by the setup operations, `GET /auth/web/session`, the web sign-ins
        while setup is pending, and Plex PINs of purpose `owner_token`. Never
        accepted where a web session is expected, and the reverse.
    preAuth:
      type: apiKey
      in: cookie
      name: __Host-tindarr_preauth
      description: |
        Not a session: a random value that binds the console's Plex PIN and Quick
        Connect sign-in handles to the browser that started them (docs/auth.md,
        section 5). Set by `POST /auth/plex/pins` and `POST /auth/quick-connect`
        when called by the console without `code_challenge`, if absent; 15 minutes;
        cleared by a successful web sign-in. Named `tindarr_preauth` under the
        plain-HTTP opt-in.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The session's CSRF token, from the `WebSession` body. Required with a
        cookie session (web or setup) on `POST`, `PUT`, `PATCH` and `DELETE`,
        compared in constant time, together with an `Origin` header equal to the
        server's origin (`403` `csrf_failed` otherwise); never checked on `GET`.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string }
    MediaTypePath:
      name: media_type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MediaType" }
    TmdbIdPath:
      name: tmdb_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PairingId:
      name: pairing_id
      in: path
      required: true
      schema: { type: string }
    ConnectorKind:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ConnectorKind" }

  headers:
    SetSessionCookie:
      description: |
        `__Host-tindarr_session=<token>; Path=/; Secure; HttpOnly; SameSite=Strict`
        (no `Max-Age`). A web sign-in also clears `__Host-tindarr_preauth`, and the
        sign-in that completes setup clears `__Host-tindarr_setup`.
      schema: { type: string }
    SetSetupCookie:
      description: "`__Host-tindarr_setup=<token>; Path=/; Secure; HttpOnly; SameSite=Strict`."
      schema: { type: string }
    SetPreAuthCookie:
      description: |
        `__Host-tindarr_preauth=<value>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=900`,
        only for a console `sign_in` handle when the browser has no pre-auth cookie
        yet.
      schema: { type: string }
    ClearSessionCookie:
      description: "Clears `__Host-tindarr_session` (`Max-Age=0`) when the caller's web session was revoked by this request."
      schema: { type: string }
    RetryAfter:
      description: Seconds, rounded up.
      schema: { type: integer, minimum: 0 }

  responses:
    Problem:
      description: Error, see `code`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: |
        `validation_error` (with `errors`; input values are never echoed),
        `bad_request` (malformed body), or `host_not_allowed` (the `Host` header is
        not an allowed host; any path but `/healthz`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        `unauthorized`: no credential this operation accepts (an `Authorization`
        header on an operation without `bearer`, or a cookie of another kind,
        counts as none), a revoked, idle-expired or past-lifetime session, a
        disabled or unlinked user. `token_expired`: the bearer access token is past
        `exp`; refresh (single-flight) and retry.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        `csrf_failed` (cookie request with an unsafe method: wrong or missing
        `X-CSRF-Token` or `Origin`) or `remote_access_denied` (the user's media
        server policy forbids remote access and the client IP is not private).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AdminForbidden:
      description: "`admin_required` (the effective role is not `admin`), `csrf_failed` or `remote_access_denied`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "`not_found`, also for another user's resource."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: |
        `rate_limited`, with `retry_after_ms`. Limits are per client IP (or per
        username, session or user where docs/auth.md section 8 says so); global
        thresholds only slow requests down, except the cap on outstanding sign-in
        handles.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Pending:
      description: Work in progress; ask again after `retry_after_ms`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Pending" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable identifier. Known values:
            - request and credentials: validation_error, bad_request,
              host_not_allowed, unauthorized, token_expired, refresh_token_reused,
              csrf_failed, https_required, forbidden, admin_required,
              media_server_admin_required, reauth_required, remote_access_denied,
              not_found, method_not_allowed, rate_limited, internal_error;
            - setup: setup_required, setup_completed, invalid_setup_code,
              setup_session_required, setting_locked;
            - sign-in: invalid_credentials, account_disabled, not_a_server_user,
              password_sign_in_disabled, sign_in_method_unavailable, pin_expired,
              plex_pin_pending, plex_owner_required, plex_tv_unreachable,
              quick_connect_unavailable, quick_connect_expired,
              media_server_unreachable, media_server_changed;
            - pairing: pairing_expired, pairing_rejected,
              pairing_not_awaiting_approval, public_url_not_set,
              public_url_unverified;
            - connectors: connector_unreachable, connector_unauthorized,
              connector_unexpected_response, media_server_unsupported,
              media_server_required, secret_required;
            - swipe and admin: last_admin, streaming_region_not_set,
              metadata_unreachable, llm_not_configured, tmdb_not_configured,
              llm_auth_failed, llm_quota, llm_model_not_found, llm_unreachable,
              llm_invalid_output, daily_limit_reached, requests_not_configured,
              no_backend_user, title_not_offered, request_not_allowed,
              quota_exceeded, request_backend_error.
          examples: [llm_quota]
        retry_after_ms:
          type: integer
          minimum: 0
          description: Set on `rate_limited` and `daily_limit_reached`; the `Retry-After` header carries the same wait in seconds, rounded up.
        reason:
          type: string
          description: |
            Coarse cause for `public_url_unverified`, never a response body:
            `host_not_allowed` (this server does not answer to that host, so no proof
            for it could exist), `unreachable`, `tls_error`, `redirected`,
            `unexpected_response` or `proof_mismatch`.
          examples: [proof_mismatch]
        errors:
          type: array
          description: Field errors for `validation_error`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Pending:
      type: object
      required: [pending, retry_after_ms]
      properties:
        pending: { type: boolean, const: true }
        retry_after_ms: { type: integer, minimum: 250 }

    ServerInfo:
      type: object
      required: [name, version, api_version, min_app_version, setup_required, auth_methods, capabilities, tmdb_image_base_url]
      properties:
        name: { type: string, description: Server display name chosen by the admin. }
        version: { type: string, examples: ["1.0.0"] }
        api_version: { type: integer, const: 1 }
        min_app_version: { type: string, examples: ["1.0.0"] }
        setup_required: { type: boolean }
        media_server:
          oneOf:
            - type: "null"
            - type: object
              required: [kind]
              properties:
                kind: { $ref: "#/components/schemas/MediaServerKind" }
                name:
                  type: [string, "null"]
                  description: What the media server calls itself, read at the last successful connection test; null while it is unknown.
        auth_methods:
          type: array
          description: |
            Ways to sign in for this caller (docs/auth.md, section 11). Empty while
            `setup_required` is true, whatever is configured (the setup wizard
            reads `GET /setup/state` instead). Otherwise:
            - `password`: Jellyfin or Emby, unless `password_sign_in` is `disabled`,
              or `lan_only` and the caller's client IP is not private;
            - `quick_connect`: Jellyfin, when the cached `GET /QuickConnect/Enabled`
              says so (left out while unknown);
            - `plex_pin`: Plex;
            - `pairing`: once `public_url` is set.
          uniqueItems: true
          items: { $ref: "#/components/schemas/AuthMethod" }
        capabilities:
          type: array
          description: Feature flags the clients enable features on, e.g. `trailers`, `ratings`, `streaming_providers`, `requests`, `notifications`.
          items: { type: string }
        tmdb_image_base_url:
          type: string
          format: uri
          description: Base the app prepends to `*_path` image fields (size segment appended by the app).
          examples: ["https://image.tmdb.org/t/p/"]
        public_url_proof:
          type: string
          description: |
            base64url(HMAC-SHA256(key, nonce + "|" + host)) with the
            `tindarr/v1/public-url-proof` sub-key, where `host` is the `Host` this
            request arrived at. Present only when the request carried a
            `Tindarr-Verify-Nonce` this server is currently waiting for, and only
            once per nonce: binding it to the host is what stops an address that can
            merely *reach* this server from relaying a proof for itself.
      if:
        required: [setup_required]
        properties:
          setup_required: { const: true }
      then:
        properties:
          auth_methods: { maxItems: 0 }

    AuthMethod:
      type: string
      enum: [password, plex_pin, quick_connect, pairing]

    SetupState:
      type: object
      description: What the setup wizard still has to do (docs/auth.md, section 3).
      required: [media_server, media_server_locked, locked_fields, locked_values, auth_methods]
      properties:
        media_server:
          description: The configured media server, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [kind]
              properties:
                kind: { $ref: "#/components/schemas/MediaServerKind" }
                name: { type: [string, "null"] }
        media_server_locked:
          type: boolean
          description: |
            `TINDARR_MEDIA_SERVER_KIND`, `_URL` and `_API_KEY` are all set: the
            wizard skips the media server step.
        locked_fields:
          type: array
          description: "`MediaServerConfigInput` fields set by environment variables (`server_type`, `url`, `api_key`, `verify_tls`)."
          items: { type: string }
        locked_values:
          type: object
          description: |
            The values the environment forces on `locked_fields`, so the wizard can
            show them and send them back unchanged in `PUT /setup/media-server`. A
            locked `api_key` is never returned: `locked_fields` says it is set, and
            the field is left empty in the form.
          required: [server_type, url, verify_tls]
          properties:
            server_type:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/MediaServerKind"
            url: { type: [string, "null"] }
            verify_tls: { type: [boolean, "null"] }
        auth_methods:
          type: array
          description: |
            Methods the administrator can use to complete setup: the rules of
            `ServerInfo.auth_methods` for this caller, without `pairing`. Empty until
            a media server is configured.
          uniqueItems: true
          items: { $ref: "#/components/schemas/AuthMethod" }

    Handle:
      type: string
      description: |
        Plex PIN or Quick Connect handle: 128 random bits, base64url. Never the
        plex.tv PIN id or the Jellyfin secret. Bound to its purpose and initiator,
        in memory only; anything wrong with it gets the same `410` as an unknown
        handle.
      pattern: "^[A-Za-z0-9_-]{22,64}$"

    CodeVerifier:
      type: string
      description: PKCE code verifier (RFC 7636), kept by the app.
      pattern: "^[A-Za-z0-9._~-]{43,128}$"

    CodeChallenge:
      type: string
      description: "PKCE S256 challenge: base64url(SHA-256(`code_verifier`)), without padding."
      pattern: "^[A-Za-z0-9_-]{43}$"

    PlexPinRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [sign_in, reauth, owner_token]
          description: See `POST /auth/plex/pins` and docs/auth.md, section 5.
        code_challenge:
          $ref: "#/components/schemas/CodeChallenge"
          description: App `sign_in` only. Without it, a `sign_in` handle is bound to the console's pre-auth cookie.
      if:
        properties:
          purpose: { not: { const: sign_in } }
      then:
        properties:
          code_challenge: false

    QuickConnectRequest:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [sign_in, reauth] }
        code_challenge:
          $ref: "#/components/schemas/CodeChallenge"
          description: App `sign_in` only. Without it, a `sign_in` handle is bound to the console's pre-auth cookie.
      if:
        properties:
          purpose: { not: { const: sign_in } }
      then:
        properties:
          code_challenge: false

    ReauthInput:
      description: Exactly one proof, checked against the currently configured media server.
      oneOf:
        - type: object
          required: [password]
          additionalProperties: false
          properties:
            password: { type: string, maxLength: 512 }
        - type: object
          required: [pin_id]
          additionalProperties: false
          properties:
            pin_id: { $ref: "#/components/schemas/Handle" }
        - type: object
          required: [handle]
          additionalProperties: false
          properties:
            handle:
              $ref: "#/components/schemas/Handle"
              description: Quick Connect handle of purpose `reauth`.

    PairingRequested:
      type: object
      description: The pairing is `awaiting_approval`; poll `POST /auth/pair/complete`.
      required: [pending, retry_after_ms, confirmation_code, expires_at]
      properties:
        pending: { type: boolean, const: true }
        retry_after_ms: { type: integer, minimum: 250, examples: [2000] }
        confirmation_code: { $ref: "#/components/schemas/ConfirmationCode" }
        expires_at:
          type: string
          format: date-time
          description: The pairing's expiry, 5 minutes after it was created.

    ConfirmationCode:
      type: string
      description: |
        4 digits derived from the `code_challenge` (first 32 bits of its SHA-256,
        modulo 10 000, zero-padded). The app and the console show it; the user
        approves only if both match.
      pattern: "^[0-9]{4}$"
      examples: ["4821"]

    DeviceInput:
      type: object
      description: Sent by the app. Web sessions describe the browser from its User-Agent instead.
      required: [name, platform, app_version]
      properties:
        name: { type: string, maxLength: 80, examples: ["Pixel 9"] }
        platform: { type: string, enum: [android, ios] }
        app_version: { type: string, maxLength: 32 }

    WebSession:
      type: object
      description: |
        A console session. The session token itself is only in the `HttpOnly`
        cookie; `csrf_token` is not a credential on its own.
      required: [kind, csrf_token, expires_at]
      properties:
        kind: { type: string, enum: [web, setup] }
        user:
          description: Null for a setup session.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/User"
        csrf_token: { type: string, description: Send as `X-CSRF-Token` on unsafe methods. }
        expires_at:
          type: string
          format: date-time
          description: Absolute end of the session (7 days for `web`, 30 minutes for `setup`); a `web` session also ends after 24 h idle.
        reauth_expires_at:
          type: [string, "null"]
          format: date-time
          description: |
            `web` only: until when the last sign-in or `POST /auth/web/reauth`
            counts as fresh (5 minutes), for the media server connector and
            `public_url`. Null when it has passed.
        setup_completed_now:
          type: boolean
          description: True when this sign-in completed the first-run setup.

    PairingCode:
      type: string
      description: At least 128 bits, base64url.
      pattern: "^[A-Za-z0-9_-]{22,64}$"

    Pairing:
      type: object
      description: |
        One of the caller's pairings (docs/auth.md, section 9). `pending`: the code
        has not been used. `awaiting_approval`: a phone asked to pair; `device`,
        `requested_from` and `confirmation_code` say which, for the user to approve
        (`POST /pairings/{id}/approve`) or reject (`DELETE /pairings/{id}`).
        `approved`: waiting for the phone to collect its tokens. `completed`: the
        phone is signed in (`session_id`). `expired`: 5 minutes passed before
        completion. `revoked`: cancelled or rejected.
      required: [id, status, created_at, expires_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, awaiting_approval, approved, completed, expired, revoked] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        requested_at: { type: [string, "null"], format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        device:
          description: The phone that asked to pair, from `awaiting_approval` on.
          oneOf:
            - type: "null"
            - type: object
              required: [name, platform]
              properties:
                name: { type: string }
                platform: { type: string }
                app_version: { type: string }
        requested_from:
          type: [string, "null"]
          description: Client IP of the phone's `POST /auth/pair`.
        confirmation_code:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ConfirmationCode"
        session_id: { type: [string, "null"], description: The session the pairing opened. }
        retry_after_ms:
          type: [integer, "null"]
          minimum: 250
          description: How long to wait before reading this pairing again; null once it is `completed`, `expired` or `revoked` and nothing more will happen.
          examples: [2000]

    NewPairing:
      allOf:
        - $ref: "#/components/schemas/Pairing"
        - type: object
          required: [code, link]
          properties:
            code: { $ref: "#/components/schemas/PairingCode" }
            link:
              type: string
              description: "`tindarr://pair?server=<public_url>&code=<code>`, rendered as a QR code (SVG or canvas), with the host of `public_url` written next to it."
              examples: ["tindarr://pair?server=https%3A%2F%2Ftindarr.example.com&code=q7Xc0vW2dYk9LmN4pRs6Tu"]

    TokenPair:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    AuthResult:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [user, setup_completed_now]
          properties:
            user: { $ref: "#/components/schemas/User" }
            setup_completed_now:
              type: boolean
              description: True when this sign-in completed the first-run setup.

    Role:
      type: string
      enum: [admin, user]

    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
          description: Effective role, `admin` when `media_server_admin` or `promoted` (docs/adr/0010).
        avatar_url: { type: [string, "null"], format: uri }
        media_server_admin:
          type: boolean
          description: |
            Administrator on the media server, as read at the user's last sign-in
            (or cleared since). Only a media server administrator can change the
            media server connector, `public_url` and `password_sign_in`.

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [enabled, media_server_admin, promoted, remote_access, created_at, votes, generations_today]
          properties:
            enabled: { type: boolean }
            disabled_reason:
              type: [string, "null"]
              enum: [admin, media_server, unlinked, null]
              description: |
                Why the user is disabled: by an admin, by the media server (removed or
                disabled there; re-enabled at their next successful sign-in), or
                unlinked after the media server was replaced. Null when enabled.
            media_server_admin:
              type: boolean
              description: Administrator on the media server, as read at the user's last sign-in (or cleared by a demotion or the hourly sync since).
            promoted: { type: boolean, description: Made admin in Tindarr. }
            remote_access:
              type: boolean
              description: From the media server policy; when false, the user is refused from non-private client IPs.
            created_at: { type: string, format: date-time }
            last_sign_in_at: { type: [string, "null"], format: date-time }
            last_seen_at: { type: [string, "null"], format: date-time }
            votes: { type: integer, minimum: 0 }
            generations_today: { type: integer, minimum: 0 }
            daily_generation_limit: { type: [integer, "null"], minimum: 0 }
            request_backend_user_found: { type: boolean }

    Session:
      type: object
      required: [id, kind, device_name, platform, created_at, last_seen_at, current]
      properties:
        id: { type: string }
        kind: { type: string, enum: [mobile, web] }
        device_name:
          type: [string, "null"]
          description: The app's `DeviceInput.name`, or the browser a web session was opened from ("Firefox on Linux"). Null only for a row written without either.
        platform:
          type: [string, "null"]
          description: "`android`, `ios`, or `web` for a console session."
        app_version: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Absolute end of the session. }
        current: { type: boolean }

    MediaType:
      type: string
      enum: [movie, tv]

    MediaFilter:
      type: string
      enum: [both, movie, tv]
      default: both

    Novelty:
      type: string
      enum: [familiar, balanced, bold]
      default: balanced

    PickType:
      type: string
      enum: [safe, explore, calibration]

    VoteValue:
      type: string
      description: |
        `like` and `dislike` are about titles not seen yet; `seen_liked` and
        `seen_disliked` about titles already seen (profile signals only). `skip`
        means "not now": the card leaves the deck, the vote teaches nothing (no
        profile rewrite, not in the prompt's vote history, not in calibration or
        like/dislike stats), and the title may be offered again 60 days later.
      enum: [like, dislike, seen_liked, seen_disliked, skip]

    RequestStatus:
      type: string
      enum: [queued, awaiting_approval, already_requested, already_available]

    Availability:
      type: string
      enum: [none, requested, processing, partially_available, available]

    TitleRef:
      type: object
      required: [media_type, tmdb_id]
      properties:
        media_type: { $ref: "#/components/schemas/MediaType" }
        tmdb_id: { type: integer, minimum: 1 }

    Ratings:
      type: object
      properties:
        tmdb: { type: [number, "null"], minimum: 0, maximum: 10 }
        imdb: { type: [number, "null"], minimum: 0, maximum: 10 }
        rotten_tomatoes: { type: [integer, "null"], minimum: 0, maximum: 100 }
        metacritic: { type: [integer, "null"], minimum: 0, maximum: 100 }

    StreamingProvider:
      type: object
      required: [provider_id, name, offer, subscribed]
      properties:
        provider_id: { type: integer, description: TMDb watch provider id. }
        name: { type: string }
        logo_path: { type: [string, "null"] }
        offer: { type: string, enum: [subscription, free, ads, rent, buy] }
        subscribed:
          type: boolean
          description: |
            "On your services": the provider is in the caller's
            `streaming_services` and the offer is `subscription`, `free` or `ads`.
            Computed when the card is returned, from the current preferences.

    ProviderOption:
      type: object
      required: [provider_id, name]
      properties:
        provider_id: { type: integer, description: TMDb watch provider id. }
        name: { type: string }
        logo_path: { type: [string, "null"] }

    Trailer:
      type: object
      required: [site, key]
      properties:
        site: { type: string, const: youtube }
        key: { type: string, pattern: "^[A-Za-z0-9_-]{6,20}$" }
        name: { type: [string, "null"], description: "Video title, e.g. for an accessible label." }
        language: { type: [string, "null"] }

    Card:
      type: object
      required: [id, media_type, tmdb_id, title, pick_type, availability, expires_at]
      properties:
        id: { type: string, description: "Opaque card id, used to vote." }
        media_type: { $ref: "#/components/schemas/MediaType" }
        tmdb_id: { type: integer }
        title: { type: string, description: In the user's language when available. }
        original_title: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        overview: { type: [string, "null"] }
        genres: { type: array, items: { type: string } }
        runtime_minutes: { type: [integer, "null"] }
        seasons: { type: [integer, "null"] }
        poster_path: { type: [string, "null"] }
        backdrop_path: { type: [string, "null"] }
        ratings: { $ref: "#/components/schemas/Ratings" }
        providers:
          type: array
          description: Streaming offers in the server's region.
          items: { $ref: "#/components/schemas/StreamingProvider" }
        trailer:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Trailer"
        rationale: { type: [string, "null"], description: Why the AI picked it. Plain text. }
        pick_type: { $ref: "#/components/schemas/PickType" }
        availability: { $ref: "#/components/schemas/Availability" }
        expires_at:
          type: string
          format: date-time
          description: When the card leaves the deck. It can still be voted on after that.

    Deck:
      type: object
      required: [mode, novelty, cards, calibration]
      properties:
        mode: { type: string, enum: [normal, calibration] }
        novelty: { $ref: "#/components/schemas/Novelty" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        calibration: { $ref: "#/components/schemas/Calibration" }
        seen_ratio_warning:
          type: boolean
          description: Many recent cards were already seen; the app may suggest a bolder novelty.

    Calibration:
      type: object
      required: [done, target, complete]
      properties:
        done: { type: integer, minimum: 0 }
        target: { type: integer, minimum: 1 }
        complete: { type: boolean }

    SwipeStatus:
      type: object
      required: [llm_configured, tmdb_configured, requests_enabled, media_history, votes, calibration, profile_ready]
      properties:
        llm_configured: { type: boolean }
        llm_provider: { type: [string, "null"], description: Display name shown before the first batch (privacy notice). }
        tmdb_configured: { type: boolean }
        requests_enabled: { type: boolean }
        media_history: { type: boolean, description: Watch history could be read for this user. }
        streaming_region: { type: [string, "null"], examples: [FR] }
        ratings_enabled: { type: boolean }
        votes: { type: integer, minimum: 0 }
        calibration: { $ref: "#/components/schemas/Calibration" }
        profile_ready: { type: boolean }
        generations_left_today: { type: [integer, "null"] }

    VoteInput:
      type: object
      required: [client_vote_id, card_id, vote]
      properties:
        client_vote_id: { type: string, format: uuid }
        card_id: { type: string }
        vote: { $ref: "#/components/schemas/VoteValue" }
        voted_at:
          type: string
          format: date-time
          description: When the user voted (offline queue); defaults to reception time.

    VoteResult:
      type: object
      required: [client_vote_id, outcome]
      properties:
        client_vote_id: { type: string, format: uuid }
        outcome: { type: string, enum: [stored, duplicate, rejected] }
        code:
          type: [string, "null"]
          description: "For `rejected`: `card_not_found` (unknown, purged or another user's card), `validation_error`. A card that left the deck can still be voted on."
        request_status:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RequestStatus"
          description: Set when auto-request is on and the vote was a like.

    Like:
      type: object
      description: A title whose current vote is `like`. `seen_liked` titles are not likes.
      required: [media_type, tmdb_id, title, liked_at, requested, availability]
      properties:
        media_type: { $ref: "#/components/schemas/MediaType" }
        tmdb_id: { type: integer }
        title: { type: string }
        year: { type: [integer, "null"] }
        poster_path: { type: [string, "null"] }
        pick_type: { $ref: "#/components/schemas/PickType" }
        liked_at: { type: string, format: date-time }
        requested: { type: boolean, description: Requested from Tindarr or already requested elsewhere. }
        availability: { $ref: "#/components/schemas/Availability" }
        watch_url:
          type: [string, "null"]
          format: uri
          description: Deep link into the media server once available.

    ProfileState:
      type: object
      required: [profile, refreshing]
      properties:
        profile:
          oneOf:
            - type: "null"
            - type: object
              required: [text, user_edited, updated_at, votes_since_update]
              properties:
                text: { type: string }
                user_edited: { type: boolean }
                updated_at: { type: string, format: date-time }
                votes_since_update: { type: integer, minimum: 0 }
        refreshing: { type: boolean }
        refresh_error:
          type: [string, "null"]
          description: Problem `code` of the last failed rewrite.

    Preferences:
      type: object
      required: [media_type, novelty, auto_request, language, streaming_services]
      properties:
        media_type: { $ref: "#/components/schemas/MediaFilter" }
        novelty: { $ref: "#/components/schemas/Novelty" }
        auto_request: { type: boolean, description: A like files the request without asking. }
        language:
          type: string
          description: BCP 47 tag for card titles and overviews; defaults to the server language.
          examples: [fr-FR]
        streaming_services:
          type: array
          description: TMDb provider ids of the services the user subscribes to (see `GET /swipe/providers`). Drives the "on your services" badge.
          uniqueItems: true
          items: { type: integer, minimum: 1 }

    PreferencesPatch:
      type: object
      minProperties: 1
      properties:
        media_type: { $ref: "#/components/schemas/MediaFilter" }
        novelty: { $ref: "#/components/schemas/Novelty" }
        auto_request: { type: boolean }
        language: { type: string, maxLength: 16 }
        streaming_services:
          type: array
          uniqueItems: true
          maxItems: 100
          items: { type: integer, minimum: 1 }

    Stats:
      type: object
      required: [total, likes, dislikes, seen_liked, seen_disliked, skips, requested, like_rate, request_rate, by_pick_type]
      properties:
        total: { type: integer, description: Votes other than `skip`. }
        likes: { type: integer }
        dislikes: { type: integer }
        seen_liked: { type: integer }
        seen_disliked: { type: integer }
        skips: { type: integer, description: Current `skip` votes; not part of `total` or of any rate. }
        requested: { type: integer }
        like_rate: { type: number, minimum: 0, maximum: 1 }
        request_rate: { type: number, minimum: 0, maximum: 1 }
        by_pick_type:
          type: object
          additionalProperties:
            type: object
            required: [total, likes]
            properties:
              total: { type: integer }
              likes: { type: integer }

    MediaServerKind:
      type: string
      enum: [jellyfin, emby, plex]

    ConnectorKind:
      type: string
      enum: [media_server, requests, tmdb, omdb, llm]

    ConnectorHealth:
      type: string
      description: |
        Coarse result of the last check, never a remote response body.
        `not_configured`: nothing is stored for this connector. `unknown`: it is
        configured but the answer did not test it — `GET /admin/connectors` never
        calls a remote service, so the console asks with
        `POST /admin/connectors/{kind}/test`.
      enum: [ok, unauthorized, unreachable, unexpected_response, unsupported_version, not_configured, unknown]

    ConnectorStatus:
      type: object
      required: [health]
      properties:
        health: { $ref: "#/components/schemas/ConnectorHealth" }
        server_name: { type: [string, "null"] }
        server_version: { type: [string, "null"] }
        checked_at: { type: [string, "null"], format: date-time, description: Null when this answer did not test the connector. }

    SecretState:
      type: object
      description: A stored secret is never returned; only whether it is set.
      required: [set]
      properties:
        set: { type: boolean }
        last4:
          type: [string, "null"]
          description: |
            Last four characters of the stored secret, so an administrator can tell
            two keys apart. Null when showing them would help nobody: a Plex
            connector holds the owner's **account** token, of which there is only
            ever one, so it is masked entirely.
        locked: { type: boolean, description: Set by an environment variable. }

    MediaServerConfigInput:
      type: object
      description: |
        Used by `PUT /setup/media-server` and the `media_server` connector. Jellyfin
        and Emby take `api_key` (an administrator API key), never `plex_pin_id`;
        Plex takes `plex_pin_id`, never `api_key`. An omitted secret keeps the
        stored one only when `url` and `server_type` are unchanged
        (`secret_required` otherwise).
      required: [connector, server_type, url]
      properties:
        connector: { type: string, const: media_server }
        server_type: { $ref: "#/components/schemas/MediaServerKind" }
        url: { type: string, format: uri, maxLength: 512, pattern: "^https?://" }
        api_key: { type: string, minLength: 1, maxLength: 512, description: Jellyfin / Emby admin API key. }
        plex_pin_id:
          $ref: "#/components/schemas/Handle"
          description: Plex only. A completed Plex PIN of purpose `owner_token` from this session; the owner token is taken from it.
        verify_tls:
          type: boolean
          description: Verify the media server's TLS certificate. Omitted means true, and must be omitted when `verify_tls` is locked by the environment.
      if:
        required: [server_type]
        properties:
          server_type: { const: plex }
      then:
        properties:
          api_key: false
      else:
        properties:
          plex_pin_id: false

    LlmProviderKind:
      type: string
      enum: [openai, anthropic, gemini, mistral, openai_compatible, ollama]

    LlmSettingsInput:
      type: object
      required: [connector, provider]
      properties:
        connector: { type: string, const: llm }
        provider: { $ref: "#/components/schemas/LlmProviderKind" }
        api_key: { type: string, maxLength: 512 }
        base_url: { type: string, format: uri, maxLength: 512, description: Required for openai_compatible and ollama. }
        model: { type: string, maxLength: 128 }
        reasoning_effort: { type: [string, "null"], enum: [low, medium, high, null] }

    RequestsInput:
      type: object
      description: Seerr, Jellyseerr or Overseerr.
      required: [connector, url]
      properties:
        connector: { type: string, const: requests }
        url: { type: string, format: uri, maxLength: 512 }
        api_key: { type: string, maxLength: 512 }
        verify_tls: { type: boolean, default: true }
        tv_seasons:
          type: string
          enum: [all, first]
          default: all
          description: Seasons requested for a series.

    ApiKeyInput:
      type: object
      required: [connector]
      properties:
        connector: { type: string, enum: [tmdb, omdb] }
        api_key: { type: string, maxLength: 512 }

    ConnectorInput:
      description: "`connector` must match the `kind` path parameter (`code` = `validation_error` otherwise)."
      oneOf:
        - $ref: "#/components/schemas/MediaServerConfigInput"
        - $ref: "#/components/schemas/LlmSettingsInput"
        - $ref: "#/components/schemas/RequestsInput"
        - $ref: "#/components/schemas/ApiKeyInput"
      discriminator:
        propertyName: connector
        mapping:
          media_server: "#/components/schemas/MediaServerConfigInput"
          llm: "#/components/schemas/LlmSettingsInput"
          requests: "#/components/schemas/RequestsInput"
          tmdb: "#/components/schemas/ApiKeyInput"
          omdb: "#/components/schemas/ApiKeyInput"

    Connector:
      type: object
      required: [kind, configured, status]
      properties:
        kind: { $ref: "#/components/schemas/ConnectorKind" }
        configured: { type: boolean }
        provider: { type: [string, "null"], description: "Media server kind or LLM provider kind." }
        url: { type: [string, "null"] }
        verify_tls: { type: [boolean, "null"] }
        model: { type: [string, "null"] }
        tv_seasons: { type: [string, "null"], enum: [all, first, null], description: Requests connector only. }
        secret: { $ref: "#/components/schemas/SecretState" }
        locked_fields: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ConnectorStatus" }

    ServerSettings:
      type: object
      required: [name, public_url, password_sign_in, language, streaming_region, daily_generation_limit, warm_up_enabled, content_filters]
      properties:
        name: { type: string }
        public_url:
          type: [string, "null"]
          format: uri
          description: |
            Origin the phones reach the server at, used in pairing QR codes; its
            host is also an allowed `Host`. `https://host[:port]`, or `http` only when
            the host is an IP literal in a private range, `localhost` or a `.local`
            name; no path, query, fragment or user info. Null until set. Not an
            accepted `Origin` for the console.
        password_sign_in: { $ref: "#/components/schemas/PasswordSignIn" }
        language: { type: string, examples: [fr-FR] }
        streaming_region: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        daily_generation_limit: { type: integer, minimum: 0, description: Default per-user cap; 0 disables generation. }
        warm_up_enabled: { type: boolean }
        content_filters: { $ref: "#/components/schemas/ContentFilters" }
        locked_fields: { type: array, items: { type: string } }

    ServerSettingsPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 60 }
        public_url:
          type: [string, "null"]
          format: uri
          maxLength: 255
          pattern: "^https?://[^/?#@]+/?$"
          description: |
            Validated as in `ServerSettings.public_url` (`validation_error`
            otherwise), then verified through that URL before saving
            (`public_url_unverified`). Media server administrator with a fresh
            re-authentication only.
        password_sign_in:
          $ref: "#/components/schemas/PasswordSignIn"
          description: Media server administrator only.
        language: { type: string, maxLength: 16 }
        streaming_region: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        daily_generation_limit: { type: integer, minimum: 0 }
        warm_up_enabled: { type: boolean }
        content_filters: { $ref: "#/components/schemas/ContentFilters" }

    PasswordSignIn:
      type: string
      description: |
        Whether Jellyfin / Emby password sign-in (and password re-authentication) is
        offered: `enabled`, `lan_only` (only from a private client IP) or
        `disabled`. Refused attempts get `403` `password_sign_in_disabled`. Quick
        Connect, Plex PIN and pairing are not affected. Set by
        `TINDARR_PASSWORD_SIGN_IN` or by a media server administrator.
      enum: [enabled, lan_only, disabled]
      default: enabled

    ContentFilters:
      type: object
      properties:
        exclude_adult: { type: boolean, default: true }
        min_year: { type: [integer, "null"] }
        excluded_genres: { type: array, items: { type: string } }
        excluded_original_languages: { type: array, items: { type: string } }

    UsageDay:
      type: object
      required: [date, user_id, generations, input_tokens, output_tokens]
      properties:
        date: { type: string, format: date }
        user_id: { type: string }
        generations: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        failures: { type: integer }
