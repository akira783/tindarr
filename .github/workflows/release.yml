name: release

# Publishes ghcr.io/akira783/tindarr (server + built console) for linux/amd64 and
# linux/arm64, signed, with an SBOM and provenance. Nothing is ever published unless a
# `v*` tag is pushed: `workflow_dispatch` runs the whole thing as a rehearsal that
# builds both architectures, writes the result to a local OCI tarball, and neither logs
# in to the registry nor pushes, signs or attests anything.
#
# Verifying a published image, as a user, from the digest the registry serves:
#
#   digest="$(crane digest ghcr.io/akira783/tindarr:1.2.3)"   # or: docker buildx imagetools inspect
#   cosign verify "ghcr.io/akira783/tindarr@${digest}" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       '^https://github\.com/akira783/tindarr/\.github/workflows/release\.yml@refs/tags/v' \
#     | jq .
#
# The signature is keyless: there is no private key anywhere: the certificate is issued
# to this workflow's GitHub OIDC identity for the duration of the run and logged in
# Rekor. The regexp above is what binds a signature to *this* workflow file on a tag of
# *this* repository — verifying without `--certificate-identity*` and
# `--certificate-oidc-issuer` proves nothing beyond "somebody signed it".
#
# The GitHub-signed build provenance (who built it, from which commit, with which
# workflow) is checked with:
#
#   gh attestation verify oci://ghcr.io/akira783/tindarr:1.2.3 --repo akira783/tindarr
#
# and the SBOM that BuildKit attached to each architecture with:
#
#   docker buildx imagetools inspect ghcr.io/akira783/tindarr:1.2.3 --format '{{ json .SBOM }}'

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, e.g. v1.2.3. Empty = the one in server/pyproject.toml. Nothing is pushed either way."
        type: string
        default: ""

# No token at all by default. Only the job below is given anything, and it is given it
# at the job level so that a workflow added here later starts from zero again.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deliberately not `cancel-in-progress: true`, unlike the other workflows in this
  # repository: a release that is halfway through pushing a manifest is the one thing
  # that must never be cancelled from under itself.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/akira783/tindarr

jobs:
  release:
    name: Build, smoke test, publish and sign
    runs-on: ubuntu-24.04
    # The arm64 half is built under QEMU, which is slow: uv installs and byte-compiles
    # the whole dependency tree emulated.
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      packages: write # push the image, and the provenance attached to it as a referrer
      id-token: write # the OIDC token cosign and the attestation are issued against
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything downstream branches on this one step, so that the rehearsal and the
      # real publication take the same path through the file.
      - name: Work out what is being released
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # Through the environment, never interpolated into the script: an input is
          # text someone typed.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("server/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
            publish=true
          else
            tag="${INPUT_VERSION:-v$project}"
            publish=false
          fi
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$tag is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi
          # The server reports its installed package version through
          # /api/v1/server/info, so a tag that disagrees with pyproject.toml would
          # publish an image that contradicts its own version label.
          if [ "$version" != "$project" ]; then
            echo "::error::tag $tag says $version but server/pyproject.toml says $project; bump the project version in the commit you tag"
            exit 1
          fi
          # `latest` only for a stable release: a pre-release must never become what a
          # `:latest` deployment pulls next.
          case "$version" in
            *-*) latest=false ;;
            *) latest=true ;;
          esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
            echo "latest=$latest"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"
          echo "$tag: publish=$publish latest=$latest"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built first, on its own, and only for the runner's own architecture, because the
      # point is to *run* it. No registry cache is used anywhere in this job: the layers
      # the multi-arch build reuses come from this builder, in this run, from this
      # commit, and nothing signed here can be traced back to a cache another branch
      # wrote. The amd64 half of the build below therefore costs nothing twice.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tindarr-server:smoke
          # `docker load` reads a single-platform image; attestations need an index.
          provenance: false
          sbom: false

      # The same script server.yml runs on every push: read-only root filesystem, no
      # capabilities, fresh volume, restart on the same volume. An image that does not
      # start, or serves no console, stops the release here, before the registry.
      - name: Smoke test it
        run: .github/scripts/docker-smoke-test.sh tindarr-server:smoke

      - name: Registry tags for this version
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` is decided above, on the version, not on the event.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step for both paths: a tag pushes the index to GHCR, a dispatch writes the
      # very same index to a tarball. There is no login on the rehearsal path, so a push
      # that slipped through the condition would fail on authentication rather than
      # publish something.
      #
      # `sbom: true` and `provenance: mode=max` are BuildKit's own attestations, carried
      # inside the image index: an SPDX document per architecture, and the SLSA
      # provenance of the build (source, Dockerfile, base image digests, build
      # arguments). They are descriptive, and signed by nobody. The
      # `actions/attest-build-provenance` step below is the complement, not a duplicate:
      # it is a Sigstore-signed statement by GitHub's own OIDC identity that this digest
      # came out of this workflow, at this commit, and it is what `gh attestation verify`
      # checks. Descriptive contents on one side, an attested origin on the other.
      - name: Build linux/amd64 and linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.release.outputs.publish == 'true' }}
          outputs: ${{ steps.release.outputs.publish == 'true' && '' || format('type=oci,dest={0}/tindarr-oci.tar', runner.temp) }}
          tags: ${{ steps.meta.outputs.tags }}
          # Only the three labels that cannot be written in the Dockerfile. The title,
          # description, source and licence are already baked in there, and
          # `steps.meta.outputs.labels` is deliberately not used: it would quietly
          # replace them with GitHub's repository metadata.
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          sbom: true
          provenance: mode=max

      # A rehearsal that only says "the build succeeded" proves nothing about what the
      # build produced. This opens the tarball and checks the index really holds both
      # architectures and their attestations.
      - name: The rehearsal really produced a two-architecture, attested index
        if: steps.release.outputs.publish != 'true'
        env:
          TARBALL: ${{ runner.temp }}/tindarr-oci.tar
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/oci"
          mkdir -p "$layout"
          tar -xf "$TARBALL" -C "$layout"
          python3 - "$layout" <<'PY'
          import json, pathlib, sys

          root = pathlib.Path(sys.argv[1])

          def blob(digest):
              algo, hexdigest = digest.split(":")
              return json.loads((root / "blobs" / algo / hexdigest).read_bytes())

          index = json.loads((root / "index.json").read_text())
          # The top level points at the image index the build produced.
          top = index["manifests"][0]
          if "index" not in top["mediaType"]:
              raise SystemExit(f"expected an image index, got {top['mediaType']}")
          manifests = blob(top["digest"])["manifests"]

          platforms, attested = set(), set()
          for manifest in manifests:
              annotations = manifest.get("annotations") or {}
              if annotations.get("vnd.docker.reference.type") == "attestation-manifest":
                  attested.add(annotations["vnd.docker.reference.digest"])
                  continue
              platform = manifest["platform"]
              platforms.add(f"{platform['os']}/{platform['architecture']}")

          expected = {"linux/amd64", "linux/arm64"}
          if platforms != expected:
              raise SystemExit(f"expected {sorted(expected)}, got {sorted(platforms)}")
          missing = {m["digest"] for m in manifests
                     if not (m.get("annotations") or {}).get("vnd.docker.reference.type")} - attested
          if missing:
              raise SystemExit(f"no attestation manifest for: {sorted(missing)}")
          print(f"index holds {sorted(platforms)}, each with its attestations")
          PY

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.release.outputs.publish == 'true'

      # Signed on the digest, never on `:latest` or `:1.2`: a tag is a name that can be
      # moved onto another image tomorrow, and a signature on a name would move with it.
      - name: Sign the image, keyless
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest how it was built
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Say what was published, and how to check it
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo 'Verify the signature:'
            echo
            echo '```console'
            echo "\$ cosign verify ${IMAGE}@${DIGEST} \\"
            echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "    --certificate-identity-regexp '^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/v'"
            echo "\$ gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
