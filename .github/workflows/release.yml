name: release

# Publishes ghcr.io/akira783/tindarr (server + built console) for linux/amd64 and
# linux/arm64, signed, with an SBOM and provenance. Nothing is ever published unless a
# `v*` tag is pushed: `workflow_dispatch` runs the whole thing as a rehearsal that
# builds and runs both architectures, writes the result to a local OCI tarball, and
# neither logs in to the registry nor pushes, signs or attests anything.
#
# The order matters more than the steps do. The index is pushed **by digest**, under no
# tag at all; it is then signed, attested and verified; and only once that has passed do
# `1.2.3`, `1.2` and `latest` get attached to it. Nothing is ever reachable by name
# before it is verifiable: a run that dies between the push and the signature leaves an
# untagged version in the registry that no `docker pull` can reach, which is the failure
# we want.
#
# Verifying a published image, as a user, from the digest the registry serves:
#
#   digest="$(crane digest ghcr.io/akira783/tindarr:1.2.3)"   # or: docker buildx imagetools inspect
#   cosign verify "ghcr.io/akira783/tindarr@${digest}" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       '^https://github\.com/akira783/tindarr/\.github/workflows/release\.yml@refs/tags/v' \
#     | jq .
#
# The signature is keyless: there is no private key anywhere; the certificate is issued
# to this workflow's GitHub OIDC identity for the duration of the run and logged in
# Rekor. The regexp above is what binds a signature to *this* workflow file on a tag of
# *this* repository — verifying without `--certificate-identity*` and
# `--certificate-oidc-issuer` proves nothing beyond "somebody signed it".
#
# The GitHub-signed build provenance (who built it, from which commit, with which
# workflow) is checked with:
#
#   gh attestation verify oci://ghcr.io/akira783/tindarr:1.2.3 \
#     --repo akira783/tindarr \
#     --signer-workflow akira783/tindarr/.github/workflows/release.yml
#
# `--repo` alone would accept an attestation from any workflow in the repository, which
# is a much weaker statement than the cosign one above; `--signer-workflow` is what
# makes the two say the same thing.
#
# And the SBOM BuildKit attached to each architecture:
#
#   docker buildx imagetools inspect ghcr.io/akira783/tindarr:1.2.3 --format '{{ json .SBOM }}'

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, e.g. v1.2.3. Empty = the one in server/pyproject.toml. Nothing is pushed either way."
        type: string
        default: ""

# No token at all by default. Only the job below is given anything, and it is given it
# at the job level so that a workflow added here later starts from zero again.
permissions: {}

concurrency:
  # The workflow name alone, with no ref: `github.ref` is `refs/tags/v1.2.3` here, so
  # keying on it would put two tags in two groups and let them race — and both of them
  # write `latest`. `git push origin v1.2.3 v1.2.4` is enough to do it. Releases are
  # serialised repository-wide.
  group: ${{ github.workflow }}
  # And never cancelled: a release halfway through signing or tagging must be allowed
  # to finish or to fail on its own.
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/akira783/tindarr
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    name: Build, smoke test, publish and sign
    runs-on: ubuntu-24.04
    # The arm64 half is built *and run* under QEMU, which is slow: uv installs and
    # byte-compiles the whole dependency tree emulated, then the smoke test starts the
    # emulated server twice.
    timeout-minutes: 90
    permissions:
      contents: read # checkout
      packages: write # push the image, and the provenance attached to it as a referrer
      id-token: write # the OIDC token cosign and the attestation are issued against
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything downstream branches on this one step, so that the rehearsal and the
      # real publication take the same path through the file.
      - name: Work out what is being released
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # Through the environment, never interpolated into the script: an input is
          # text someone typed.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release-version.py

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ env.PLATFORMS }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One architecture at a time, loaded into the daemon, because the point is to
      # *run* them. No registry cache is used anywhere in this job: the layers the
      # publishing build reuses come from this builder, in this run, from this commit,
      # and nothing signed here can be traced back to a cache another branch wrote. The
      # build below therefore costs nothing twice.
      - name: Build the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tindarr-server:smoke-amd64
          # `docker load` reads a single-platform image; attestations need an index.
          provenance: false
          sbom: false

      - name: Build the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          load: true
          tags: tindarr-server:smoke-arm64
          provenance: false
          sbom: false

      # The same script server.yml runs on every push: read-only root filesystem, no
      # capabilities, fresh volume, restart on the same volume. An image that does not
      # start, or serves no console, stops the release here, before the registry.
      #
      # Both architectures, because publishing one that was never started is publishing
      # a guess: a dependency that has no aarch64 wheel and falls back to an sdist, or a
      # base image that differs, is invisible to an index-shape check. The arm64
      # container runs under QEMU through the binfmt handlers installed above.
      - name: Smoke test amd64
        run: .github/scripts/docker-smoke-test.sh tindarr-server:smoke-amd64

      - name: Smoke test arm64, emulated
        env:
          SMOKE_PORT: "18788"
        run: .github/scripts/docker-smoke-test.sh tindarr-server:smoke-arm64

      - name: Registry tags for this version
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` is decided in the step above, on the version, not on the event.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step for both paths: a tag pushes the index to GHCR **by digest and under no
      # tag**, a dispatch writes the very same index to a tarball. There is no login on
      # the rehearsal path, so a push that slipped through the condition would fail on
      # authentication rather than publish something.
      #
      # `sbom: true` and `provenance: mode=max` are BuildKit's own attestations, carried
      # inside the image index: an SPDX document per architecture, and the SLSA
      # provenance of the build (source, Dockerfile, base image digests, build
      # arguments). They are descriptive, and signed by nobody. The
      # `actions/attest-build-provenance` step below is the complement, not a duplicate:
      # it is a Sigstore-signed statement by GitHub's own OIDC identity that this digest
      # came out of this workflow, at this commit, and it is what `gh attestation verify`
      # checks. Descriptive contents on one side, an attested origin on the other.
      - name: Build both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          # `tags:` is deliberately unset on both paths: the registry learns no name
          # here. `push-by-digest` refuses a tag anyway, and the rehearsal must not
          # take a different route through this action.
          #
          # Written the negative way round on purpose: `cond && a || b` is the trap
          # where an empty or falsy `a` lets the `||` branch win anyway. The value that
          # must never leak into the other path is the one the `&&` yields.
          outputs: ${{ steps.release.outputs.publish != 'true' && format('type=oci,name={0},dest={1}/tindarr-oci.tar', env.IMAGE, runner.temp) || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          # Only the three labels that cannot be written in the Dockerfile. The title,
          # description, source and licence are already baked in there, and
          # `steps.meta.outputs.labels` is deliberately not used: it would quietly
          # replace them with GitHub's repository metadata.
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          sbom: true
          provenance: mode=max

      # A rehearsal that only says "the build succeeded" proves nothing about what the
      # build produced. Same assertions as the published index is checked with below.
      - name: The rehearsal really produced a two-architecture, attested index
        if: steps.release.outputs.publish != 'true'
        env:
          TARBALL: ${{ runner.temp }}/tindarr-oci.tar
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/oci"
          mkdir -p "$layout"
          tar -xf "$TARBALL" -C "$layout"
          python3 .github/scripts/check-image-index.py --oci-layout "$layout" --expect "$PLATFORMS"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.release.outputs.publish == 'true'

      # `--recursive` signs the index *and* every manifest under it. Without it only the
      # index carries a signature, and anything that resolves the platform first and
      # verifies the digest it lands on — an admission controller, or a
      # `crane digest --platform linux/arm64` followed by a verify — is told there are
      # no matching signatures for a perfectly good image.
      #
      # On the digest, never on `1.2.3` or `latest`: a tag is a name that can be moved
      # onto another image tomorrow, and a signature on a name would move with it. At
      # this point in the run no tag exists yet anyway.
      - name: Sign the image and every manifest in it, keyless
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - name: Attest how it was built
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Everything above is checked here, against the registry, exactly as a user would
      # check it — and before any name points at it. If Fulcio was down, if the
      # signature never reached the registry, or if the index that arrived is not the
      # one we think we built, the release fails here with nothing published under a
      # name anyone can pull.
      - name: Verify what was pushed, as a stranger would
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # A repository name may contain a dot, which is a regexp metacharacter.
          repo="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/\./\\./g')"
          identity="^https://github\\.com/${repo}/\\.github/workflows/release\\.yml@refs/tags/v"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$identity" >/dev/null
          echo "signature verified against $identity"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | python3 .github/scripts/check-image-index.py - --expect "$PLATFORMS"

      # Only now does the image get a name. `imagetools create` copies the index the
      # signature was made on, so every tag resolves to the digest that was verified
      # above — which the loop then insists on, because a tag pointing anywhere else
      # would make `cosign verify ghcr.io/akira783/tindarr:1.2.3` fail for users.
      # The three tags are as close to atomic as a registry allows: one command, and
      # nothing between them that can fail slowly.
      - name: Attach the tags to the verified digest
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          targets=()
          while IFS= read -r tag; do
            # metadata-action's list may end with a blank line.
            [ -n "$tag" ] || continue
            targets+=(--tag "$tag")
          done <<<"$TAGS"
          [ "${#targets[@]}" -gt 0 ] || { echo "::error::no tag to attach"; exit 1; }
          docker buildx imagetools create "${targets[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            resolved="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")"
            if [ "$resolved" != "$DIGEST" ]; then
              echo "::error::$tag resolves to $resolved, not the signed $DIGEST"
              exit 1
            fi
            echo "$tag -> $resolved"
          done <<<"$TAGS"

      - name: Say what was published, and how to check it
        if: steps.release.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo 'Verify it:'
            echo
            echo '```console'
            echo "\$ cosign verify ${IMAGE}@${DIGEST} \\"
            echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "    --certificate-identity-regexp '^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/v'"
            echo "\$ gh attestation verify oci://${IMAGE}@${DIGEST} \\"
            echo "    --repo ${GITHUB_REPOSITORY} \\"
            echo "    --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
