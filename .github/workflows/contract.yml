name: contract

on:
  push:
    branches: [main]
    paths: &paths
      - "api/**"
      - "redocly.yaml"
      - ".redocly.lint-ignore.yaml"
      - ".github/workflows/contract.yml"
      - ".github/tools/redocly/**"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint api/openapi.yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The lockfile pins Redocly CLI and every transitive dependency by hash.
      - name: Install Redocly CLI
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/tools/redocly
      - name: Redocly lint
        run: .github/tools/redocly/node_modules/.bin/redocly lint
