name: server

on:
  push:
    branches: [main]
    # The two lists must stay identical. They are written out rather than shared
    # through a YAML anchor: anchors are a YAML feature, not a workflow feature,
    # and tools that read workflows without expanding them see a dangling alias.
    paths:
      - "server/**"
      # The image contains the web console, built from these.
      - "web/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".dockerignore"
      - ".github/workflows/server.yml"
      - ".github/scripts/docker-smoke-test.sh"
  pull_request:
    paths:
      - "server/**"
      # The image contains the web console, built from these.
      - "web/**"
      - "shared/**"
      - "api/openapi.yaml"
      - ".dockerignore"
      - ".github/workflows/server.yml"
      - ".github/scripts/docker-smoke-test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.17"

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  evaluation:
    name: Evaluation harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      # Offline: the adapters talk through the recorded cassette, and a request it does
      # not hold raises rather than reaching TMDb. --check fails the build when a number
      # slid past the tolerance in the committed baseline (docs/evaluation.md).
      #
      # Both committed vote sets, each against its own baselines. The author's real 99
      # votes are what ADR 0013 was measured on; the generated set is what says the
      # harness computes what it claims to. A gate on one of them is half a gate.
      - name: Replay the author's votes (akira-99) against their baselines
        run: |
          uv run tindarr eval run --fixtures fixtures/eval/akira-99 --strategy popular --check
          uv run tindarr eval run --fixtures fixtures/eval/akira-99 --strategy random --check
          uv run tindarr eval run --fixtures fixtures/eval/akira-99 --strategy hybrid --check
      - name: Replay the generated votes (synthetic-99) against their baselines
        run: |
          uv run tindarr eval run --fixtures fixtures/eval/synthetic-99 --strategy popular --check
          uv run tindarr eval run --fixtures fixtures/eval/synthetic-99 --strategy random --check
          uv run tindarr eval run --fixtures fixtures/eval/synthetic-99 --strategy hybrid --check

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - name: pip-audit on the locked dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --require-hashes --disable-pip --progress-spinner off \
            -r "$RUNNER_TEMP/requirements.txt"

  image:
    name: Image build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (no push)
        # From the repository root: the image contains the console.
        working-directory: .
        run: docker build --pull --file server/Dockerfile --tag tindarr-server:ci .
      - name: Smoke test (read-only, no capabilities)
        working-directory: .
        run: .github/scripts/docker-smoke-test.sh tindarr-server:ci
