# Development only: the server runs migrations itself at startup (tindarr.storage.migrate).
# New revision:  uv run alembic revision --autogenerate --rev-id 0002 -m "add users"
# (autogenerate compares the tables with a database at head, created by the command below)
# Upgrade:       uv run alembic upgrade head
[alembic]
script_location = %(here)s/src/tindarr/storage/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///data/tindarr.db

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
